<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーキング・メーター・マップ</title>
<meta name="description" content="東京・大阪・京都・札幌のパーキング・メーター／パーキング・チケットの設置区間を地図で探せます。各都道府県警察の公開情報を使っています。">
<meta name="theme-color" content="#1E4E8C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="パーキング・メーター・マップ">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css?v=ec929f11">
<link rel="stylesheet" href="styles.css?v=e4b412d6">
</head>
<body>

<header class="mast">
  <h1><span class="sub">ON-STREET PARKING · JAPAN</span>パーキング・メーター・マップ</h1>
  <span class="spacer"></span>
  <button class="menubtn" id="menuBtn" aria-label="メニュー" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="menu" id="menu" hidden>
    <button id="menuList"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>一覧で見る</button>
    <div id="menuPrefs"></div>
    <button id="menuFit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全体を表示</button>
    <a href="https://parking-meter.jp/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>警視庁の地図</a>
  </nav>
</header>

<main class="mapwrap">
  <div id="map"></div>

  <div class="topbar">
    <form class="search" id="qform" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="地名・駅名へ移動（例：銀座）" aria-label="地名で移動">
    </form>
    <div class="qnote" id="qnote" role="status" hidden></div>
    <div class="barrow">
      <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        条件入力<span class="fcount" id="fcount" hidden>0</span>
      </button>
      <span class="count" role="status" aria-atomic="true"><b id="n">0</b> 区間</span>
    </div>

    <div class="filters" id="filters" hidden>
      <label><span>都府県</span><select id="pref"></select></label>
      <label><span>区・市</span><select id="ward" disabled></select></label>
      <label><span>町名</span><select id="town" disabled></select></label>
      <label><span>曜日</span>
        <select id="days">
          <option value="">すべて</option>
          <option value="daily">土日・祝日も使える</option>
          <option value="closed">日曜・祝日は除く</option>
        </select>
      </label>
      <label><span>時間帯</span>
        <select id="at">
          <option value="">すべて</option>
          <option value="now">いま使える</option>
        </select>
      </label>
      <label><span>制限時間</span>
        <select id="limit">
          <option value="">すべて</option>
          <option value="20">20分まで</option>
          <option value="40">40分まで</option>
        </select>
      </label>
      <label><span>車種</span>
        <select id="vehicle">
          <option value="">すべて</option>
          <option value="truck">貨物用あり</option>
          <option value="bike">二輪車</option>
        </select>
      </label>
      <p class="fnote" id="fnote"></p>
      <p class="fnote fempty" id="fempty" hidden>条件に合う区間がありません。条件を減らすか「条件をクリア」を押してください。</p>
      <div class="factions">
        <button class="btn" id="freset" type="button">条件をクリア</button>
        <button class="btn primary" id="fdone" type="button"><span id="n2">0</span> 区間を表示</button>
      </div>
    </div>
  </div>

  <!-- 現在地ボタンは地図の右下（ズームの上）へ app.js が移す -->
  <button class="mapbtn" id="locate" title="現在地を表示" aria-label="現在地を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <div class="legend">
    <div class="lrow"><span class="k daily"></span>土日・祝日も使える</div>
    <div class="lrow"><span class="k plain"></span>メーター</div>
    <div class="lrow"><span class="k closed"></span>日曜・祝日は除く</div>
    <div class="lrow"><span class="k plain ticket"></span>チケット</div>
  </div>
</main>

<aside class="listpanel" id="listpanel" aria-label="一覧" hidden>
  <div class="listhead">
    <h2 tabindex="-1">一覧 <small><span id="n3">0</span> 区間</small></h2>
    <button class="close" id="listClose" aria-label="一覧を閉じる">×</button>
  </div>
  <div class="listsort">
    <span class="sortnote" id="sortnote"></span>
    <select id="sort" aria-label="並べ方"><option value="near">近い順</option><option value="area">エリアごと</option></select>
  </div>
  <ul class="list" id="list"></ul>
</aside>

<div class="empty" id="empty" hidden>
  <div class="card">
    <h2>区間データを読み込めませんでした</h2>
    <p>通信状態を確かめて、読み込み直してください。</p>
    <button class="btn primary" id="retry" type="button">読み込み直す</button>
  </div>
</div>

<aside class="detail" id="detail" aria-label="区間の詳細" inert></aside>

<script src="config.js?v=2ea24b0d"></script>
<script src="vendor/leaflet.js?v=5a640ff8"></script>
<script src="zones.js?v=44bf01ba"></script>
<script src="app.js?v=31966c74"></script>
</body>
</html>
