<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーキングメーター地図</title>
<meta name="description" content="東京都内のパーキング・メーター／パーキング・チケットの設置区間を地図で探せます。警視庁の時間制限駐車区間オープンデータを使っています。">
<meta name="theme-color" content="#1E4E8C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="mast">
  <h1><span class="sub">TOKYO · ON-STREET PARKING</span>パーキングメーター地図</h1>
  <span class="spacer"></span>
  <label class="ghost" id="importBtn" title="警視庁のオープンデータ（GeoJSON）を読み込む">
    データを読み込む<input type="file" id="importFile" accept=".geojson,.json,application/geo+json,application/json" hidden>
  </label>
</header>

<div class="mobtabs" role="tablist">
  <button id="tabList" aria-pressed="true">一覧</button>
  <button id="tabMap" aria-pressed="false">地図</button>
</div>

<div class="app">
  <aside class="panel">
    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="地名・路線名・住所で検索" aria-label="検索">
      </label>
      <div class="seg" role="group" aria-label="種類">
        <button data-kind="" aria-pressed="true">すべて</button>
        <button data-kind="meter" aria-pressed="false"><i class="k meter"></i>メーター</button>
        <button data-kind="ticket" aria-pressed="false"><i class="k ticket"></i>チケット</button>
      </div>
      <div class="selrow">
        <select id="ward" aria-label="区市町村"></select>
        <select id="limit" aria-label="制限時間">
          <option value="">制限時間：すべて</option>
          <option value="40">40分以内</option>
          <option value="60">60分以内</option>
          <option value="61">60分超</option>
        </select>
      </div>
    </div>
    <div class="tally"><span><b id="n">0</b> 区間</span><span class="sortnote" id="sortnote">地図の中心から近い順</span></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="mapwrap">
    <div id="map"></div>
    <div class="mapbtns">
      <button class="mapbtn" id="locate" title="現在地"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="mapbtn" id="fitall" title="全体を表示"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="legend">
      <div class="lrow"><span class="k meter"></span>パーキング・メーター</div>
      <div class="lrow"><span class="k ticket"></span>パーキング・チケット</div>
    </div>
  </main>
</div>

<div class="empty" id="empty" hidden>
  <div class="card">
    <h2>区間データがまだ入っていません</h2>
    <p>警視庁の<a href="https://parking-meter.jp/open-data" target="_blank" rel="noopener">時間制限駐車区間案内地図のオープンデータ</a>から GeoJSON をダウンロードし、右上の「データを読み込む」で選んでください。この端末に保存され、次回からもそのまま表示されます。</p>
    <p class="small">公開用には、同じファイルを <code>data/zones.geojson</code> に置くと全員に表示されます。</p>
  </div>
</div>

<aside class="detail" id="detail" aria-label="区間の詳細"></aside>

<script src="config.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="zones.js"></script>
<script src="app.js"></script>
</body>
</html>
