<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パーキングメーター地図</title>
<meta name="description" content="東京都内のパーキング・メーター／パーキング・チケット752区間を、現在地から近い順に地図で探せます。警視庁の時間制限駐車区間オープンデータを使っています。">
<meta name="theme-color" content="#1E4E8C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="mast">
  <h1><span class="sub">TOKYO · ON-STREET PARKING</span>パーキングメーター地図</h1>
  <span class="spacer"></span>
  <a class="ghost" href="https://parking-meter.jp/" target="_blank" rel="noopener">警視庁の地図</a>
</header>

<div class="mobtabs" role="tablist">
  <button id="tabList" aria-pressed="true">一覧</button>
  <button id="tabMap" aria-pressed="false">地図</button>
</div>

<div class="app">
  <aside class="panel">
    <div class="controls">
      <form class="search" id="qform" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="地名・駅名へ移動（例：銀座、新宿駅）" aria-label="地名で移動">
      </form>
      <div class="qnote" id="qnote" hidden></div>
      <div class="seg" role="group" aria-label="種類">
        <button data-kind="" aria-pressed="true">すべて</button>
        <button data-kind="meter" aria-pressed="false"><i class="k meter"></i>メーター</button>
        <button data-kind="ticket" aria-pressed="false"><i class="k ticket"></i>チケット</button>
      </div>
      <div class="selrow">
        <select id="limit" aria-label="制限時間">
          <option value="">制限時間：すべて</option>
          <option value="20">20分まで</option>
          <option value="40">40分まで</option>
        </select>
        <select id="vehicle" aria-label="車種">
          <option value="">車種：すべて</option>
          <option value="truck">貨物用あり</option>
          <option value="bike">二輪車</option>
        </select>
      </div>
      <label class="chk"><input type="checkbox" id="nowonly"><span>いま利用時間内だけ<small>（祝日は判定しません）</small></span></label>
    </div>
    <div class="tally"><span><b id="n">0</b> 区間</span><span class="sortnote" id="sortnote">地図の中心から近い順</span></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="mapwrap">
    <div id="map"></div>
    <div class="mapbtns">
      <button class="mapbtn" id="locate" title="現在地"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="mapbtn" id="fitall" title="全体を表示"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="legend">
      <div class="lrow"><span class="k meter"></span>パーキング・メーター</div>
      <div class="lrow"><span class="k ticket"></span>パーキング・チケット</div>
    </div>
  </main>
</div>

<div class="empty" id="empty" hidden>
  <div class="card">
    <h2>区間データを読み込めませんでした</h2>
    <p>通信状態を確かめて、ページを読み込み直してください。</p>
  </div>
</div>

<aside class="detail" id="detail" aria-label="区間の詳細"></aside>

<script src="config.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="zones.js"></script>
<script src="app.js"></script>
</body>
</html>
